<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="toast-container" id="toastContainer"></div>
    <h2>Получите бесплатное блюдо</h2>
    <div class="container">
      <div class="text">
        <p>Введите номер телефона</p>
        <p>На этот номер доступен один розыгрыш</p>
        <div id="phone-form-container">
          <form id="phoneForm">
            <input
                    type="tel"
                    id="phoneInput"
                    placeholder="+7 (999) 999-99-99"
                    maxlength="18"
                    class="form-input"
            />
            <input type="submit" value="Получить код" id="submitPhone" />
          </form>
        </div>
        <div id="code-form-container" class="hidden">
          <form id="codeForm">
            <input
                    type="tel"
                    id="codeInput"
                    placeholder="1234"
                    maxlength="4"
                    class="form-input"
            />
            <input type="submit" value="Подтвердить" id="submitCode" />
          </form>
        </div>
        <div class="agree-container"><input type="checkbox" name="agreement" id="agreement" class="agreement"><a href="https://storage.growfood.pro/s1/vcp/68e60672031e8.pdf" target="blank">Я даю согласие на&nbsp;обработку персональных данных</a></div>
        <a href="https://storage.growfood.pro/s1/marketing/files/10_2025/%D0%9E%D1%84%D0%B5%D1%80%D1%82%D0%B0_%D0%93%D0%A4_%D0%A0%D0%BE%D0%B7%D1%8B%D0%B3%D1%80%D1%8B%D1%88_%D0%B5%D0%B4%D1%8B_10_10_25_%D0%91%D0%B5%D1%81%D0%BF%D0%BB%D0%B0%D1%82%D0%BD%D0%B0%D1%8F_%D0%B5%D0%B4%D0%B0.pdf" target="blank">Правила акции</a>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
 

</html>
